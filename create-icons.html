<!DOCTYPE html>
<html>
<head>
  <title>Create Icons</title>
</head>
<body>
  <h1>Creating placeholder icons...</h1>
  <canvas id="icon16" width="16" height="16"></canvas>
  <canvas id="icon48" width="48" height="48"></canvas>
  <canvas id="icon128" width="128" height="128"></canvas>
  <script>
    function createIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#4F46E5');
      gradient.addColorStop(1, '#7C3AED');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // White "J" letter
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.6}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('J', size / 2, size / 2);
    }
    
    createIcon('icon16', 16);
    createIcon('icon48', 48);
    createIcon('icon128', 128);
    
    // Download icons
    setTimeout(() => {
      ['icon16', 'icon48', 'icon128'].forEach((id, i) => {
        const canvas = document.getElementById(id);
        const link = document.createElement('a');
        link.download = `icon${[16, 48, 128][i]}.png`;
        link.href = canvas.toDataURL();
        link.click();
      });
      document.body.innerHTML = '<h1>Icons created! Check your downloads folder.</h1><p>Move icon16.png, icon48.png, and icon128.png to the icons/ folder.</p>';
    }, 500);
  </script>
</body>
</html>
